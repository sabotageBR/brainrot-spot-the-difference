<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio de diferenças</title>
<style>
  :root{--tinta:#221c30;--fundo:#f3f1f8;--marca:#ff2d6f;--borda:#d9d4e6}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,sans-serif;color:var(--tinta);background:var(--fundo);display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--borda);flex-wrap:wrap}
  header h1{font-size:16px;margin:0 10px 0 0}
  button,select{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--borda);background:#fff;cursor:pointer}
  button.forte{background:var(--marca);color:#fff;border-color:var(--marca)}
  button.ligado{background:var(--tinta);color:#fff}
  #estado{margin-left:auto;font-weight:600}
  main{position:relative;overflow:hidden;display:grid;place-items:center;padding:10px}
  #tela{max-width:100%;max-height:100%;background:#000;box-shadow:0 4px 20px rgba(0,0,0,.2);cursor:crosshair}
  aside{overflow:auto;background:#fff;border-left:1px solid var(--borda);padding:10px}
  aside h2{font-size:14px;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
  .cand{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:4px;border-radius:8px;border:1px solid transparent}
  .cand.esc{border-color:var(--marca);background:#fff0f5}
  .cand canvas{width:100%;height:auto;border-radius:6px;display:block}
  .cand small{opacity:.7}
  .pers{display:flex;gap:6px;align-items:center;margin:4px 0}
  .pers.ativo{outline:2px solid #2f7bff;border-radius:6px}
  .dica{font-size:12px;opacity:.7}
</style>
</head>
<body>
<header>
  <h1>Estúdio de diferenças</h1>
  <select id="selCena"></select>
  <button id="bAnalisar">Analisar</button>
  <button id="bAuto">Auto 7</button>
  <span>Ver:</span>
  <select id="selVer"></select>
  <button id="bPiscar">Piscar A/B</button>
  <button id="bManual" title="Arraste um retângulo na imagem para criar um remendo da variante escolhida">Remendo manual</button>
  <button id="bSalvar" class="forte">Salvar cena</button>
  <span id="estado">—</span>
</header>
<main><canvas id="tela" width="1024" height="768"></canvas></main>
<aside>
  <h2>Escolhidas <span id="contaEsc">0</span>/7</h2>
  <div id="listaEsc"></div>
  <h2>Personagens (figurinhas)</h2>
  <div class="dica">Clique num personagem e arraste a caixa na imagem.</div>
  <div id="listaPers"></div>
  <div class="pers"><select id="selNovoPers"></select><button id="bAddPers">+</button></div>
  <h2>Candidatas</h2>
  <div class="dica">Clique numa candidata (aqui ou na imagem) para escolher ou tirar.</div>
  <div id="listaCand"></div>
</aside>
<script type="module" src="estudio.js"></script>
</body>
</html>
